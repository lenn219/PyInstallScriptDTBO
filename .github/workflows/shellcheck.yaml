name: ShellCheck

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]
    
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck {} +

      - name: Run ShellCheck Install
        run: find . -type f -name "*.install" -exec shellcheck {} +
